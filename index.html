<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
</head>
<body>

    <div class="app">

        <!-- ===== TOP BAR ===== -->
        <header class="topbar">
            <div class="topbar-left">
                <span class="logo-mark">◆</span>
                <span class="logo-text">QR Studio</span>
            </div>
            <div class="topbar-right">
                <button class="btn btn-ghost btn-sm" id="scanBtn">
                    <span class="icon">◷</span> Scan
                </button>
                <div class="theme-toggle" id="darkModeToggle" role="button" tabindex="0">
                    <span class="theme-icon-light">◐</span>
                    <span class="theme-icon-dark">◑</span>
                </div>
            </div>
        </header>

        <!-- ===== MAIN LAYOUT ===== -->
        <main class="main">

            <!-- ===== LEFT: CONTROLS ===== -->
            <section class="controls">

                <!-- Template -->
                <div class="control-group">
                    <label for="templateSelect">Template</label>
                    <select id="templateSelect">
                        <option value="text">Plain Text</option>
                        <option value="wifi">WiFi</option>
                        <option value="contact">Contact</option>
                        <option value="event">Event</option>
                    </select>
                </div>

                <!-- Dynamic Fields -->
                <div id="templateFields" class="template-fields">
                    <!-- Filled by JavaScript on load -->
                </div>

                <!-- Appearance -->
                <div class="control-group">
                    <label>Appearance</label>
                    <div class="appearance-row">
                        <div class="color-dot-wrap">
                            <span class="color-label">Dots</span>
                            <input type="color" id="fgColor" value="#111111" />
                        </div>
                        <div class="color-dot-wrap">
                            <span class="color-label">Background</span>
                            <input type="color" id="bgColor" value="#ffffff" />
                        </div>
                        <div class="size-wrap">
                            <span class="color-label">Size</span>
                            <div class="size-control">
                                <input type="range" id="sizeSlider" min="200" max="500" value="300" />
                                <span class="size-value" id="sizeLabel">300</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Corner Style -->
                <div class="control-group">
                    <label>Corner style</label>
                    <div class="corner-selector" id="cornerSelector">
                        <button data-style="square" class="active">Square</button>
                        <button data-style="rounded">Rounded</button>
                        <button data-style="circle">Circle</button>
                    </div>
                </div>

                <!-- Logo -->
                <div class="control-group">
                    <label>Logo <span class="label-hint">optional</span></label>
                    <div class="logo-upload-row">
                        <input type="file" id="logoUpload" accept="image/png,image/jpeg" />
                        <button class="btn btn-ghost btn-sm" id="removeLogoBtn">Remove</button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button class="btn btn-primary btn-block" id="generateBtn">
                        <span class="icon">⟳</span> Generate
                    </button>
                    <div class="action-grid">
                        <button class="btn btn-ghost btn-sm" id="downloadPNG">PNG</button>
                        <button class="btn btn-ghost btn-sm" id="downloadSVG">SVG</button>
                        <button class="btn btn-ghost btn-sm" id="downloadPDF">PDF</button>
                        <button class="btn btn-ghost btn-sm" id="copyToClipboard">Copy</button>
                    </div>
                </div>

            </section>

            <!-- ===== RIGHT: PREVIEW ===== -->
            <section class="preview" id="previewBox">
                <div class="qr-wrapper">
                    <div id="qrcode"></div>
                </div>
                <div class="preview-meta">
                    <span class="preview-label" id="dataPreviewText">https://example.com</span>
                    <span class="preview-hint">Click history to reload</span>
                </div>
            </section>

        </main>

        <!-- ===== HISTORY & ANALYTICS ===== -->
        <section class="bottom-section">

            <!-- Analytics -->
            <div class="analytics">
                <div class="analytics-item">
                    <span class="analytics-number" id="totalScans">0</span>
                    <span class="analytics-label">Total scans</span>
                </div>
                <div class="analytics-divider"></div>
                <div class="analytics-item">
                    <span class="analytics-number" id="uniqueCodes">0</span>
                    <span class="analytics-label">Unique codes</span>
                </div>
                <div class="analytics-divider"></div>
                <div class="analytics-item">
                    <span class="analytics-number" id="todayScans">0</span>
                    <span class="analytics-label">Today</span>
                </div>
            </div>

            <!-- History -->
            <div class="history">
                <div class="history-header">
                    <span class="history-title">History</span>
                    <span class="history-badge" id="historyCount">0</span>
                    <div class="history-actions">
                        <button class="btn btn-ghost btn-xs" id="exportHistoryBtn">Export</button>
                        <button class="btn btn-ghost btn-xs" id="clearHistoryBtn">Clear</button>
                    </div>
                </div>
                <div class="history-grid" id="historyGrid">
                    <!-- Filled by JS -->
                </div>
            </div>

            <!-- Bulk -->
            <div class="bulk">
                <span class="bulk-label">Bulk generate</span>
                <div class="bulk-row">
                    <input type="file" id="csvUpload" accept=".csv" />
                    <button class="btn btn-ghost btn-sm" id="bulkGenerateBtn">Generate ZIP</button>
                </div>
                <div id="bulk-status"></div>
            </div>

        </section>

    </div>

    <!-- ===== SCANNER MODAL ===== -->
    <div class="modal" id="scannerModal">
        <div class="modal-content">
            <button class="modal-close" id="scannerCloseBtn">✕</button>
            <h2>Scan QR Code</h2>
            <p>Position the code in front of your camera.</p>
            <div id="scanner-container"></div>
            <div class="scanner-status" id="scannerStatus">Waiting for camera...</div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
